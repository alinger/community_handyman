basePath: /
definitions:
  github_com_alinger_community-handyman_server_internal_dto.AdminCancelReq:
    properties:
      reason:
        example: 用户来电要求取消
        maxLength: 200
        type: string
    required:
    - reason
    type: object
  github_com_alinger_community-handyman_server_internal_dto.AdminLoginReq:
    properties:
      password:
        example: your-password
        maxLength: 64
        type: string
      username:
        example: admin
        maxLength: 32
        type: string
    required:
    - password
    - username
    type: object
  github_com_alinger_community-handyman_server_internal_dto.AdminRescheduleReq:
    properties:
      service_date:
        example: "2026-11-21"
        type: string
      slot_code:
        example: 10-12
        maxLength: 16
        type: string
    required:
    - service_date
    - slot_code
    type: object
  github_com_alinger_community-handyman_server_internal_dto.AdvanceOrderReq:
    properties:
      node:
        example: in_service
        maxLength: 32
        type: string
    required:
    - node
    type: object
  github_com_alinger_community-handyman_server_internal_dto.AssignOrderReq:
    properties:
      provider_id:
        example: 3
        type: integer
    required:
    - provider_id
    type: object
  github_com_alinger_community-handyman_server_internal_dto.BindPhoneReq:
    properties:
      code:
        example: "123456"
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CancelOrderReq:
    properties:
      reason:
        example: 临时有事
        maxLength: 200
        type: string
    type: object
  github_com_alinger_community-handyman_server_internal_dto.ChangeMyPwdReq:
    properties:
      new_password:
        example: new-password
        maxLength: 64
        minLength: 6
        type: string
      old_password:
        example: old-password
        maxLength: 64
        type: string
    required:
    - new_password
    - old_password
    type: object
  github_com_alinger_community-handyman_server_internal_dto.ChangePasswordReq:
    properties:
      new_password:
        maxLength: 32
        type: string
      old_password:
        maxLength: 32
        type: string
    required:
    - new_password
    - old_password
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CheckAreaReq:
    properties:
      community:
        maxLength: 64
        type: string
      house_no:
        maxLength: 32
        type: string
      lane:
        maxLength: 64
        type: string
    required:
    - community
    - house_no
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CopySlotsReq:
    properties:
      source_date:
        example: "2026-11-20"
        type: string
      target_dates:
        example:
        - "2026-11-21"
        items:
          type: string
        maxItems: 62
        minItems: 1
        type: array
    required:
    - source_date
    - target_dates
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CreateAddressReq:
    properties:
      community:
        maxLength: 64
        type: string
      contact_name:
        maxLength: 32
        type: string
      contact_phone:
        maxLength: 20
        type: string
      extra:
        maxLength: 255
        type: string
      house_no:
        maxLength: 32
        type: string
      lane:
        maxLength: 64
        type: string
    required:
    - community
    - house_no
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CreateAdminReq:
    properties:
      password:
        example: your-password
        maxLength: 64
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - operator
        example: operator
        type: string
      username:
        example: operator01
        maxLength: 32
        type: string
    required:
    - password
    - role
    - username
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CreateAreaReq:
    properties:
      community:
        example: 东方冠郡二期
        maxLength: 64
        type: string
      house_from:
        example: 1
        minimum: 0
        type: integer
      house_parity:
        enum:
        - all
        - odd
        - even
        example: all
        type: string
      house_to:
        example: 89
        minimum: 0
        type: integer
      lane:
        example: 众安路779弄
        maxLength: 128
        type: string
    required:
    - community
    - lane
    type: object
  github_com_alinger_community-handyman_server_internal_dto.CreateOrderReq:
    properties:
      access_info:
        maxLength: 100
        type: string
      address_id:
        type: integer
      distance_km:
        maximum: 50
        minimum: 0
        type: number
      duration_min:
        maximum: 120
        minimum: 0
        type: integer
      entry_method:
        description: |-
          EntryMethod / AccessInfo 进入方式与门禁信息（选填）。
          AccessInfo 是明文入参，服务端加密后落库，任何接口都不会明文回传原始密文。
        enum:
        - knock
        - password
        - card
        - property
        - other
        type: string
      extra_slot_code:
        description: ExtraSlotCode 包月备选服务时间：选中后取代默认时段，每天按它上门（空表示按默认时段）
        maxLength: 16
        type: string
      feed_only:
        type: boolean
      garbage_type:
        enum:
        - kitchen
        - other
        - recyclable
        type: string
      hospital:
        description: 陪诊专用：医院与服务项只回传 code，价格由后端按 SKU 规则计算
        maxLength: 64
        type: string
      need_familiar:
        type: boolean
      patient_name:
        maxLength: 32
        type: string
      pet_count:
        maximum: 10
        minimum: 0
        type: integer
      pet_notes:
        description: PetNotes 宠物备注（选填）：类型、名字、情况等
        maxLength: 200
        type: string
      plan:
        enum:
        - single
        - monthly
        type: string
      quantity:
        maximum: 50
        minimum: 0
        type: integer
      remark:
        maxLength: 200
        type: string
      service_date:
        description: "2006-01-02"
        type: string
      service_items:
        items:
          type: string
        maxItems: 20
        type: array
      service_type:
        enum:
        - garbage
        - dogwalk
        - accompany
        type: string
      slot_code:
        maxLength: 16
        type: string
    required:
    - address_id
    - service_date
    - service_type
    - slot_code
    type: object
  github_com_alinger_community-handyman_server_internal_dto.DevLoginReq:
    properties:
      nickname:
        example: 住户甲
        maxLength: 64
        type: string
      openid:
        example: resident_01
        maxLength: 64
        type: string
      role:
        enum:
        - user
        - provider
        - admin
        example: user
        type: string
    required:
    - openid
    type: object
  github_com_alinger_community-handyman_server_internal_dto.RefundReq:
    properties:
      amount:
        example: 1000
        minimum: 0
        type: integer
      order_no:
        example: CH202611191335571191
        maxLength: 32
        type: string
      reason:
        example: 服务时长不足补偿
        maxLength: 200
        type: string
    required:
    - order_no
    - reason
    type: object
  github_com_alinger_community-handyman_server_internal_dto.RegisterReq:
    properties:
      nickname:
        example: 张阿姨
        maxLength: 32
        type: string
      password:
        example: "123456"
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - password
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.RejectOrderReq:
    properties:
      reason:
        example: 当天排期满
        maxLength: 200
        type: string
    type: object
  github_com_alinger_community-handyman_server_internal_dto.RescheduleReq:
    properties:
      reason:
        description: Reason 改期原因，服务方申请时强烈建议填写，住户据此判断是否同意
        maxLength: 200
        type: string
      service_date:
        description: "2006-01-02"
        type: string
      slot_code:
        maxLength: 16
        type: string
    required:
    - service_date
    - slot_code
    type: object
  github_com_alinger_community-handyman_server_internal_dto.ResetAdminPwdReq:
    properties:
      password:
        example: new-password
        maxLength: 64
        minLength: 6
        type: string
    required:
    - password
    type: object
  github_com_alinger_community-handyman_server_internal_dto.RespondRescheduleReq:
    properties:
      approve:
        type: boolean
      reason:
        description: Reason 拒绝原因，会覆盖到改期记录里给服务方看
        maxLength: 200
        type: string
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SendSmsCodeReq:
    properties:
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
      scene:
        enum:
        - login
        - reset
        example: login
        type: string
    required:
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetAdminStatusReq:
    properties:
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetAreaStatusReq:
    properties:
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetSlotItem:
    properties:
      service_type:
        enum:
        - garbage
        - dogwalk
        - accompany
        example: dogwalk
        type: string
      slot_code:
        example: 18-20
        maxLength: 16
        type: string
      total:
        example: 5
        maximum: 200
        minimum: 0
        type: integer
    required:
    - service_type
    - slot_code
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetSlotsReq:
    properties:
      date:
        example: "2026-11-20"
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.SetSlotItem'
        minItems: 1
        type: array
    required:
    - date
    - items
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetUserRoleReq:
    properties:
      role:
        enum:
        - user
        - provider
        example: provider
        type: string
    required:
    - role
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SetUserStatusReq:
    properties:
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SmsLoginReq:
    properties:
      code:
        example: "123456"
        type: string
      nickname:
        example: 张阿姨
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - code
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.SmsResetPasswordReq:
    properties:
      code:
        example: "123456"
        type: string
      new_password:
        example: "123456"
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - code
    - new_password
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.UpdateAddressReq:
    properties:
      community:
        maxLength: 64
        type: string
      contact_name:
        maxLength: 32
        type: string
      contact_phone:
        maxLength: 20
        type: string
      extra:
        maxLength: 255
        type: string
      house_no:
        maxLength: 32
        type: string
      lane:
        maxLength: 64
        type: string
    required:
    - community
    - house_no
    type: object
  github_com_alinger_community-handyman_server_internal_dto.UpdateAreaReq:
    properties:
      community:
        example: 东方冠郡二期
        maxLength: 64
        type: string
      house_from:
        example: 1
        minimum: 0
        type: integer
      house_parity:
        enum:
        - all
        - odd
        - even
        example: all
        type: string
      house_to:
        example: 89
        minimum: 0
        type: integer
      lane:
        example: 众安路779弄
        maxLength: 128
        type: string
    required:
    - community
    - lane
    type: object
  github_com_alinger_community-handyman_server_internal_dto.UpdateMeReq:
    properties:
      avatar:
        description: Avatar 为头像地址（由头像上传接口返回）。留空表示不改动头像。
        example: /api/v1/users/12/avatar/1732000000.png
        maxLength: 512
        type: string
      nickname:
        example: 张阿姨
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - nickname
    type: object
  github_com_alinger_community-handyman_server_internal_dto.UpdateSkuReq:
    properties:
      base_price:
        example: 4000
        minimum: 0
        type: integer
      rules:
        type: object
    type: object
  github_com_alinger_community-handyman_server_internal_dto.UserLoginReq:
    properties:
      password:
        example: "123456"
        maxLength: 32
        type: string
      phone:
        example: "13800138000"
        maxLength: 20
        type: string
    required:
    - password
    - phone
    type: object
  github_com_alinger_community-handyman_server_internal_dto.WechatLoginReq:
    properties:
      avatar:
        maxLength: 512
        type: string
      code:
        example: 0a1B2c3D
        maxLength: 128
        type: string
      nickname:
        example: 张阿姨
        maxLength: 64
        type: string
    required:
    - code
    type: object
  github_com_alinger_community-handyman_server_internal_dto.WechatPhoneReq:
    properties:
      code:
        example: 0a1B2c3D
        maxLength: 128
        type: string
    required:
    - code
    type: object
  github_com_alinger_community-handyman_server_pkg_response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      request_id:
        type: string
    type: object
info:
  contact: {}
  description: |-
    社区生活服务预约平台后端接口：地址范围校验、下单支付、履约、运营后台。
    用户端需 X-User-Id（接入微信登录后改为 Bearer JWT）；后台需 Bearer token。
  title: 邻有回应 API
  version: "1.1"
paths:
  /api/admin/accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 后台账号列表
      tags:
      - 运营后台
    post:
      consumes:
      - application/json
      description: 仅超管；角色 operator 只能做日常运营，admin 才能退款与账号管理
      parameters:
      - description: 账号信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.CreateAdminReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 新建后台账号
      tags:
      - 运营后台
  /api/admin/accounts/{id}/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 账号 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.ResetAdminPwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 重置后台账号密码
      tags:
      - 运营后台
  /api/admin/accounts/{id}/status:
    patch:
      consumes:
      - application/json
      description: 不能停用自己的账号；停用后该账号无法登录
      parameters:
      - description: 账号 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 1 启用 / 0 停用
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.SetAdminStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 启停后台账号
      tags:
      - 运营后台
  /api/admin/areas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 服务范围列表
      tags:
      - 运营后台
    post:
      consumes:
      - application/json
      parameters:
      - description: 范围规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.CreateAreaReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 新增服务范围
      tags:
      - 运营后台
  /api/admin/areas/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: 范围 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 范围规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.UpdateAreaReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 修改服务范围
      tags:
      - 运营后台
  /api/admin/areas/{id}/status:
    patch:
      consumes:
      - application/json
      description: 停用不影响已存在的订单
      parameters:
      - description: 范围 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 1 启用 / 0 停用
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.SetAreaStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 启停服务范围
      tags:
      - 运营后台
  /api/admin/export/orders:
    get:
      description: 与订单列表同筛选条件；带 BOM，Excel 直接打开不乱码；上限 5000 行
      parameters:
      - description: 订单状态
        in: query
        name: status
        type: string
      - description: 服务类型
        in: query
        name: service_type
        type: string
      - description: 订单号模糊搜索
        in: query
        name: keyword
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - AdminToken: []
      summary: 订单导出 CSV
      tags:
      - 运营后台
  /api/admin/login:
    post:
      consumes:
      - application/json
      description: 返回 Bearer token，默认 12 小时有效
      parameters:
      - description: 账号密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.AdminLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 1002 账号或密码错误
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      summary: 后台登录
      tags:
      - 运营后台
  /api/admin/orders:
    get:
      parameters:
      - description: 订单状态
        in: query
        name: status
        type: string
      - description: 服务类型
        in: query
        name: service_type
        type: string
      - description: 订单号模糊搜索
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - AdminToken: []
      summary: 后台订单查询
      tags:
      - 运营后台
  /api/admin/orders/{orderNo}/assign:
    post:
      consumes:
      - application/json
      description: 服务开始前（待接单 / 已受理 / 待上门）可派单或改派；派单即刻生效，订单进入「已受理」
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 服务方 ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.AssignOrderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
