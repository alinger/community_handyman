      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 请求体：reason(string)
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 拒绝历史陪诊报价（兼容旧订单）
      tags:
      - 订单
  /api/v1/orders/{orderNo}/records:
    get:
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 服务记录列表
      tags:
      - 服务记录
    post:
      consumes:
      - multipart/form-data
      description: 记录一经写入不可删除。图片 ≤10MB；视频 ≤80MB 且不超过 60 秒；文书 ≤20MB
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: photo / video / advice / document
        in: formData
        name: media_type
        required: true
        type: string
      - description: 视频时长（秒），图片传 0
        in: formData
        name: duration_sec
        type: integer
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 1001 类型或大小不合规 / 1003 无权访问该订单
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
        "201":
          description: data 为 service.ToRecordResp
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 上传服务记录
      tags:
      - 服务记录
  /api/v1/orders/{orderNo}/records/{recordID}/file:
    get:
      description: 带鉴权并校验订单归属；支持 Range，视频可拖动进度
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 记录 ID
        in: path
        name: recordID
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: 无权访问
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 下载服务记录文件
      tags:
      - 服务记录
