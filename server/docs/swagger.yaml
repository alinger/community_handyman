      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 提交服务方认证申请
      tags:
      - 服务方认证
  /api/v1/provider/application/cert:
    post:
      consumes:
      - multipart/form-data
      description: 仅支持 jpg/png/webp 且 ≤8MB；返回的 key 在提交申请时回传
      parameters:
      - description: front / back / health
        in: formData
        name: kind
        required: true
        type: string
      - description: 图片
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: data.key 为附件 key
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 上传认证附件
      tags:
      - 服务方认证
  /api/v1/provider/application/cert/{kind}:
    get:
      parameters:
      - description: front / back / health
        in: path
        name: kind
        required: true
        type: string
      produces:
      - application/octet-stream
      responses: {}
      security:
      - UserID: []
      summary: 查看认证附件
      tags:
      - 服务方认证
  /api/v1/provider/income:
    get:
      description: 已完成订单自动入账后的累计金额与最近明细
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.ProviderIncomeResp
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 我的收入
      tags:
      - 服务方
  /api/v1/provider/orders:
    get:
      parameters:
      - description: pending / processing / completed
        in: query
        name: tab
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 服务方名下订单
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/accept:
    post:
      description: 条件更新，先到先得；已被接单返回 2003
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 接单
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/advance:
    post:
      consumes:
      - application/json
      description: 目标状态必须满足状态机白名单，非法跳转返回 2003
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 目标节点
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.AdvanceOrderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 推进节点
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/monthly/finish:
    post:
      description: 打卡之后才能点；同一天重复完成返回 2003，未打卡返回 2003
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.MonthlyProgress
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 月卡本趟完成
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/monthly/redeem:
    post:
      description: 包月代倒垃圾按天核销；同一天重复打卡返回 2003，不在服务期内返回 1001
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.MonthlyProgress
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 月卡今日打卡
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 拒单原因
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.RejectOrderReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 拒单
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/reschedule:
    post:
      consumes:
      - application/json
      description: 仅已受理订单可申请；提交后等住户确认，确认前仍按原时间服务
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      - description: 新日期与新时段
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_alinger_community-handyman_server_internal_dto.RescheduleReq'
      produces:
      - application/json
      responses:
        "200":
          description: 2003 状态不允许或有待确认申请
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 申请改期
      tags:
      - 服务方
  /api/v1/provider/orders/{orderNo}/reschedule/ack:
    post:
      parameters:
      - description: 订单号
        in: path
        name: orderNo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 确认知悉住户改期
      tags:
      - 服务方
  /api/v1/provider/orders/open:
    get:
      description: 已支付且未派单的订单
      parameters:
      - description: garbage / dogwalk / accompany
        in: query
        name: service_type
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 可接单池
      tags:
      - 服务方
  /api/v1/service-areas:
    get:
      description: 按小区聚合的路段与门牌区间，供「服务范围」页展示；无需登录，访客也能看。
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误，见 code
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      summary: 服务范围
      tags:
      - 地址
  /api/v1/services/accompany/options:
    get:
      description: 返回后台配置的医院列表与可多选的陪诊服务项（含单价，单位分）；价格仅供展示，下单金额由后端按同一配置计算
      produces:
      - application/json
      responses:
        "200":
          description: data 为 pricing.AccompanyOptions
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 陪诊服务选项
      tags:
      - 服务配置
  /api/v1/services/garbage-plan:
    get:
      description: |-
        新增地址时小区只能从这份后台配置列表中选择，不能自由输入
        价格、天数、默认取件时段与可选额外时段；数据来自 SKU 规则，改配置不用发版
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: data 为 dto.GarbagePlanResp
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 包月方案
      tags:
      - 地址
      - 服务
  /api/v1/services/slots:
    get:
      description: 返回指定日期与服务类型的各时段库存；后台未配置该日库存时返回空数组，前端视为全部可选
      parameters:
      - description: 服务日期 YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      - description: 服务类型 garbage/dogwalk/accompany
        in: query
        name: service_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.SlotAvailability 数组
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      security:
      - UserID: []
      summary: 时段余量
      tags:
      - 服务配置
  /api/v1/users/{id}/avatar/{name}:
    get:
      description: |-
        公开接口：小程序 image 标签无法携带 Authorization 头，故不鉴权。
        文件名由服务端生成且不可猜，不暴露用户目录结构。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 文件名
        in: path
        name: name
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: 文件不存在
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      summary: 读取头像
      tags:
      - 个人信息
  /callback/sandbox/pay:
    post:
      consumes:
      - application/json
      description: 仅 sandbox 渠道启用。报文：order_no、transaction_id、amount、sign（HMAC-SHA256）
      produces:
      - application/json
      responses:
        "200":
          description: 1001 验签失败或金额不一致
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      summary: 沙箱支付回调
      tags:
      - 回调
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_alinger_community-handyman_server_pkg_response.Body'
      summary: 健康检查
      tags:
      - 运维
securityDefinitions:
  AdminToken:
    description: 后台 token，格式：Bearer <token>
    in: header
    name: Authorization
    type: apiKey
  UserID:
    description: 本地联调的用户标识
    in: header
    name: X-User-Id
    type: apiKey
swagger: "2.0"
